[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-tracker"
version = "0.1.0"
description = "AI-powered career page tracker with agentic architecture"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "scikit-learn>=1.4,<2",
    "python-telegram-bot>=21.0,<22",
    "anthropic>=0.40,<1",
    "apscheduler>=3.10,<4",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "flask>=3.0,<4",
]

[project.optional-dependencies]
js = [
    "playwright>=1.40,<2",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.5,<1",
    "mypy>=1.8,<2",
    "respx>=0.21,<1",
]
all = [
    "career-tracker[js,dev]",
]

[project.scripts]
career-tracker = "orchestrator.run:main"
career-tracker-dashboard = "dashboard.app:run_dashboard"
career-tracker-schedule = "scheduler.scheduler:start_scheduler"

[tool.setuptools.packages.find]
include = [
    "schema*",
    "config*",
    "fetcher*",
    "extractor*",
    "dedup*",
    "matcher*",
    "filter*",
    "notifier*",
    "orchestrator*",
    "scheduler*",
    "advisor*",
    "dashboard*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
